<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header  class="header">
   
        <div class="wrapper">
            <div class="header__wrapper">
                <div class="header__logo">
                    <a href="/" class="header__logo-link">
                        <img src="./img/svg/logo.svg" alt="COFFE HOUSE" class="header__logo-pic">
                    </a>
                </div>
                <nav class="header__navlog">
                      <ul class="header__list">
                        <li class="header__item">
                            <a href="#!" class="header__link">Favorite coffee</a>
                        </li>
                        <li class="header__item">
                            <a href="#!" class="header__link">About</a>
                        </li>
                        <li class="header__item">
                            <a href="#!" class="header__link">Mobile app</a>
                        </li>
                        <li class="header__item">
                            <a href="#!" class="header__link">Contact us</a>
                        </li>
                      </ul>  
                </nav>
                 <div class="header__action">
                    <div class="theme-switch">
                        <input type="radio" name="theme" id="light" checked>
                        <label for="light" class="theme-option sun"><img src="./img/svg/Sun.svg" alt="Sun" class="header__sun-pic"></label>
                      
                        <input type="radio" name="theme" id="dark">
                        <label for="dark" class="theme-option moon"><img src="./img/svg/Moon.svg" alt="Moon" class="header__moon-pic"></label>
                      </div>
                    <div class="header__action-coffe">
                        <a href="#!" class="header__coffe-link">Menu</a>
                        <img src="./img/svg/coffee-cup.svg" alt="COFFE CUP" class="header__coffe-pic">
                    </div>
                </div>
            </div>
        </div>
   </header>
   <main class="main">
<div class="main-wrapper">
    <div class="offer">
        <h2 class="offer__title">Behind each of our cups<br>hides an <span class="offer__title-italic">amazing surprise</span></h2>
        <div class="category-buttons">
  <button class="category-button active">
    <span class="icon-circle">
      <img src="./img/png/icon1.png" alt="coffee" class="icon">
    </span>
    <span>Coffee</span>
  </button>

  <button class="category-button">
    <span class="icon-circle">
      <img src="./img/png/icon2.png" alt="tea" class="icon">
    </span>
    <span>Tea</span>
  </button>

  <button class="category-button">
    <span class="icon-circle">
      <img src="./img/png/icon3.png" alt="dessert" class="icon">
    </span>
    <span>Dessert</span>
  </button>
</div>
    </div>
</div>
<section class="grid">
    <div class="wrapper-grid">
    <article class="card">
  <img src="/img/jpg/coffee-1.jpg" alt="Coffee-1" class="card-img">

  <div class="card-content">
   <div class="card__content-text">
     <h2 class="card__title">Irish coffee</h2>
    <p class="card__text">Fragrant black coffee with<br> Jameson Irish whiskey and<br> whipped milk</p>
   </div>
    <strong class="card__price">$7.00</strong>
  </div>
</article>
    </div>
</section>
   </main>
</body>
</html>
